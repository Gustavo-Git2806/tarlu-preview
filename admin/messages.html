<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Messages — Tarlu Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin.css">
<link rel="icon" href="https://assets.zyrosite.com/cdn-cgi/image/format=auto,w=64/mp8JxO6q3MTPNqDR/tarlu_nav_logo.3x-mk3JeXBqJKsKOvW4.png">
</head>
<body>

<div class="a-header">
    <div>
        <h1>Messages</h1>
        <p>Enquiries received through the contact form.</p>
    </div>
</div>

<div class="a-card">
    <h2>Inbox <span style="color:var(--a-muted); font-weight:400; font-size:0.9rem;">(0)</span></h2>
    <div class="a-empty">
        <div class="a-empty-ico" data-icon="mail"></div>
        <div>No enquiries yet. When the contact form receives submissions, they'll appear here.</div>
        <div style="margin-top:0.75rem; font-size:0.85rem; color:var(--a-muted);">Preview build — the contact form is client-side only. Wire it to a form endpoint (Formspree, Netlify Forms, etc.) to start collecting messages.</div>
    </div>
</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/admin.js"></script>
<script>
    (async function () {
        if (!(await window.TarluAdmin.requireAuth())) return;
        window.TarluAdmin.mountShell({ active: 'messages' });
    })();
</script>

</body>
</html>
